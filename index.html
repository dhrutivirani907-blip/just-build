```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Ads Counter</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101828, #1d3557);
  color: white;
}

.container {
  width: 100%;
  max-width: 380px;
  text-align: center;
}

.title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 25px;
}

.card {
  padding: 35px 20px;
  border-radius: 24px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.label {
  font-size: 14px;
  color: #b8c4d6;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.count {
  font-size: 64px;
  font-weight: 900;
  margin-bottom: 30px;
}

.watch-btn {
  display: flex;
  justify-content: center;
  align-items: center;

  width: 100%;
  min-height: 58px;

  border: 0;
  border-radius: 15px;

  background: #00c853;
  color: white;

  font-size: 18px;
  font-weight: 800;

  text-decoration: none;
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.watch-btn:active {
  transform: scale(.97);
}

.status {
  min-height: 22px;
  margin-top: 18px;
  font-size: 14px;
  color: #b8c4d6;
}
</style>
</head>

<body>

<div class="container">

  <div class="title">
    📺 ADS REWARD
  </div>

  <div class="card">

    <div class="label">
      Total Ads Watched
    </div>

    <div
      id="count"
      class="count">
      0
    </div>

    <!-- DIRECT AD LINK -->
    <a
      id="watchButton"
      class="watch-btn"
      href="https://www.profitableratecpmnetwork.com/h2c4my1bx?key=c652d96306553d9d16506b15173c981f"
      target="_blank"
      rel="noopener noreferrer">

      ▶ WATCH ADS

    </a>

    <div
      id="status"
      class="status">

      Click WATCH ADS to start

    </div>

  </div>

</div>


<script>

/* =========================================
   SETTINGS
========================================= */

const MIN_TIME = 8000;

const STORAGE_COUNT = "ads_total_count";
const STORAGE_START = "ads_start_time";


/* =========================================
   LOAD COUNT
========================================= */

let totalAds =
  parseInt(
    localStorage.getItem(STORAGE_COUNT) || "0",
    10
  );

updateCount();


/* =========================================
   UPDATE COUNT
========================================= */

function updateCount() {

  document.getElementById("count").textContent =
    totalAds.toLocaleString();

}


/* =========================================
   START AD
========================================= */

document
  .getElementById("watchButton")
  .addEventListener("click", function () {

    /*
      Save the exact time when the user
      clicked WATCH ADS.
    */

    localStorage.setItem(
      STORAGE_START,
      Date.now().toString()
    );

    document.getElementById("status").textContent =
      "⏳ Watching ad...";

  });


/* =========================================
   CHECK RETURN
========================================= */

function checkReturn() {

  const start =
    parseInt(
      localStorage.getItem(STORAGE_START) || "0",
      10
    );

  if (!start) {
    return;
  }


  const elapsed =
    Date.now() - start;


  /*
    User must be away for at least 8 seconds.
  */

  if (elapsed < MIN_TIME) {

    document.getElementById("status").textContent =
      "⏳ Please stay on the ad for 8 seconds.";

    return;

  }


  /*
    COUNT +1
  */

  totalAds++;

  localStorage.setItem(
    STORAGE_COUNT,
    totalAds.toString()
  );


  /*
    Remove pending ad.
  */

  localStorage.removeItem(
    STORAGE_START
  );


  updateCount();


  document.getElementById("status").textContent =
    "✅ Ad counted!";


}


/* =========================================
   WHEN USER RETURNS TO PAGE
========================================= */

document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.visibilityState === "visible"
    ) {

      setTimeout(
        checkReturn,
        500
      );

    }

  }
);


/* =========================================
   PAGE SHOW
========================================= */

window.addEventListener(
  "pageshow",
  function () {

    setTimeout(
      checkReturn,
      500
    );

  }
);


/* =========================================
   WINDOW FOCUS
========================================= */

window.addEventListener(
  "focus",
  function () {

    setTimeout(
      checkReturn,
      500
    );

  }
);

</script>

</body>
</html>
