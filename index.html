
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Ads Reward</title>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


/* ================================
   BODY
================================ */

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at top,
            #263b68 0%,
            #111827 45%,
            #070b13 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* ================================
   MAIN
================================ */

.container {

    width: 100%;

    max-width: 390px;

}


/* ================================
   HEADER
================================ */

.header {

    text-align: center;

    margin-bottom: 22px;

}

.logo {

    width: 64px;

    height: 64px;

    margin: auto;

    border-radius: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    background:
        linear-gradient(
            135deg,
            #00e676,
            #00a844
        );

    box-shadow:
        0 10px 30px
        rgba(0, 230, 118, .25);

}

.title {

    margin-top: 14px;

    font-size: 27px;

    font-weight: 900;

    letter-spacing: -.5px;

}

.subtitle {

    margin-top: 6px;

    font-size: 14px;

    color: #9ca9bd;

}


/* ================================
   CARD
================================ */

.card {

    position: relative;

    overflow: hidden;

    padding: 28px 20px 22px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    backdrop-filter: blur(18px);

}


/* glow */

.card::before {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    top: -100px;

    right: -80px;

    border-radius: 50%;

    background:
        rgba(0,230,118,.12);

    filter: blur(25px);

}


/* ================================
   LABEL
================================ */

.count-label {

    position: relative;

    text-align: center;

    color: #9ca9bd;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1.4px;

    text-transform: uppercase;

}


/* ================================
   COUNT
================================ */

.count {

    position: relative;

    text-align: center;

    margin-top: 8px;

    font-size: 64px;

    line-height: 1.1;

    font-weight: 900;

    letter-spacing: -2px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #b8ffd5
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    background-clip: text;

}


/* ================================
   SMALL INFO
================================ */

.info {

    text-align: center;

    margin-top: 8px;

    color: #7f8ca1;

    font-size: 13px;

}


/* ================================
   BUTTON
================================ */

.watch-button {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    width: 100%;

    min-height: 60px;

    margin-top: 28px;

    border-radius: 17px;

    text-decoration: none;

    color: #04120a;

    background:
        linear-gradient(
            135deg,
            #42ff9b,
            #00d968
        );

    font-size: 17px;

    font-weight: 900;

    letter-spacing: .3px;

    box-shadow:
        0 12px 28px
        rgba(0, 217, 104, .25);

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


/* button press */

.watch-button:active {

    transform:
        scale(.97);

    box-shadow:
        0 5px 15px
        rgba(0, 217, 104, .18);

}


/* play icon */

.play-icon {

    width: 30px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        rgba(0,0,0,.12);

    font-size: 14px;

}


/* ================================
   STATUS
================================ */

.status {

    min-height: 20px;

    text-align: center;

    margin-top: 17px;

    color: #9ca9bd;

    font-size: 13px;

}


/* ================================
   FOOTER
================================ */

.footer {

    text-align: center;

    margin-top: 18px;

    color: #66748a;

    font-size: 11px;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 360px) {

    .title {
        font-size: 24px;
    }

    .count {
        font-size: 55px;
    }

    .card {
        padding: 25px 16px 20px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            ▶
        </div>

        <div class="title">
            ADS REWARD
        </div>

        <div class="subtitle">
            Watch ads and earn rewards
        </div>

    </div>



    <!-- CARD -->

    <div class="card">


        <div class="count-label">
            Total Ads Watched
        </div>


        <div
            id="count"
            class="count">

            0

        </div>


        <div class="info">
            Your completed ads
        </div>



        <!-- WATCH BUTTON -->

        <a
            id="watchButton"
            class="watch-button"

            href="https://www.profitableratecpmnetwork.com/h2c4my1bx?key=c652d96306553d9d16506b15173c981f"

            target="_blank"

            rel="noopener noreferrer">

            <span class="play-icon">
                ▶
            </span>

            WATCH ADS

        </a>



        <!-- STATUS -->

        <div
            id="status"
            class="status">

            Tap the button to start watching

        </div>


    </div>



    <div class="footer">

        Ads Reward System

    </div>


</div>



<script>

/* ==========================================
   STORAGE
========================================== */

const COUNT_KEY =
    "ads_reward_total";


const PENDING_KEY =
    "ads_reward_pending";


/* ==========================================
   LOAD COUNT
========================================== */

let totalAds =
    parseInt(
        localStorage.getItem(COUNT_KEY) || "0",
        10
    );


updateCount();



/* ==========================================
   UPDATE COUNT
========================================== */

function updateCount() {

    document.getElementById("count").textContent =
        totalAds.toLocaleString();

}



/* ==========================================
   WATCH BUTTON
========================================== */

const watchButton =
    document.getElementById("watchButton");


watchButton.addEventListener(
    "click",
    function () {

        /*
         * Mark an ad as opened.
         */

        localStorage.setItem(
            PENDING_KEY,
            "1"
        );


        document.getElementById("status").textContent =
            "Ad opened...";

    }
);



/* ==========================================
   COUNT AD
========================================== */

function countAd() {

    const pending =
        localStorage.getItem(PENDING_KEY);


    if (pending !== "1") {

        return;

    }


    /*
     * ADD +1
     */

    totalAds++;


    localStorage.setItem(
        COUNT_KEY,
        totalAds.toString()
    );


    /*
     * Remove pending state
     */

    localStorage.removeItem(
        PENDING_KEY
    );


    updateCount();


    document.getElementById("status").textContent =
        "✓ Ad counted successfully";


}



/* ==========================================
   USER RETURNS TO PAGE
========================================== */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState === "visible"
        ) {

            setTimeout(
                countAd,
                300
            );

        }

    }
);



/* ==========================================
   PAGE SHOW
========================================== */

window.addEventListener(
    "pageshow",
    function () {

        setTimeout(
            countAd,
            300
        );

    }
);



/* ==========================================
   WINDOW FOCUS
========================================== */

window.addEventListener(
    "focus",
    function () {

        setTimeout(
            countAd,
            300
        );

    }
);

</script>


</body>
</html>
